name: Cross-Compile Termux Theme (Rust)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            filename: termux-theme-rust-aarch64
          - target: armv7-linux-androideabi
            filename: termux-theme-rust-armv7
          - target: x86_64-linux-android
            filename: termux-theme-rust-x86_64
          - target: i686-linux-android
            filename: termux-theme-rust-i686

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Target Binary
        run: |
          cargo ndk --target ${{ matrix.target }} build --release

      - name: Prepare Output Binary
        run: |
          cp target/${{ matrix.target }}/release/termux-theme ${{ matrix.filename }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: ${{ matrix.filename }}
