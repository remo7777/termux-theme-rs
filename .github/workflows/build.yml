name: Cross-Compile Termux Theme (Rust)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            filename: termux-theme-rust-aarch64
          - target: armv7-linux-androideabi
            filename: termux-theme-rust-armv7
          - target: x86_64-linux-android
            filename: termux-theme-rust-x86_64
          - target: i686-linux-android
            filename: termux-theme-rust-i686

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Target Binary
        run: |
          NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/26* 2>/dev/null | tail -n 1)
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH="${ANDROID_NDK_ROOT:-$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | tail -n 1)}"
          fi
          export ANDROID_NDK_HOME="$NDK_PATH"
          echo "Using ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          cargo ndk -t ${{ matrix.target }} -p 24 build --release

      - name: Prepare Output Binary
        run: |
          cp target/${{ matrix.target }}/release/termux-theme ${{ matrix.filename }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: ${{ matrix.filename }}
